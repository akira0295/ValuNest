{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="container narrow" style="margin-top:60px;">
  <div style="text-align:center;margin-bottom:24px;">
    <div style="font-size:40px;margin-bottom:8px;">🏠</div>
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to your account</p>
  </div>
  <form method="post">
    <div class="form-group">
      <label>Email address</label>
      <input type="email" name="email" placeholder="you@email.com" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <div style="position:relative;">
        <input type="password" name="password" id="loginPw"
               placeholder="Your password" required style="padding-right:44px;">
        <button type="button" onclick="togglePw('loginPw', this)"
                style="position:absolute;right:14px;top:50%;transform:translateY(-50%);
                       background:none;border:none;cursor:pointer;font-size:16px;
                       color:var(--text-3);padding:0;line-height:1;">👁</button>
      </div>
    </div>
    <button type="submit" class="btn btn-full" style="margin-top:8px;">Sign in →</button>
  </form>
  <div class="auth-footer">
    Don't have an account? <a href="{{ url_for('register') }}" class="link">Register here</a>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function togglePw(id, btn) {
  const inp = document.getElementById(id);
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  btn.textContent = show ? '🙈' : '👁';
}
</script>
{% endblock %}
