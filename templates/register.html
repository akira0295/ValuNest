{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="container narrow" style="margin-top:60px;">
  <div style="text-align:center;margin-bottom:24px;">
    <div style="font-size:40px;margin-bottom:8px;">🏠</div>
    <h1>Create account</h1>
    <p class="subtitle">Start predicting house prices today</p>
  </div>
  <form method="post">
    <div class="form-group">
      <label>Full name</label>
      <input type="text" name="name" placeholder="Your name" required>
    </div>
    <div class="form-group">
      <label>Email address</label>
      <input type="email" name="email" placeholder="you@email.com" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <div style="position:relative;">
        <input type="password" name="password" id="regPw"
               placeholder="Create a password" required style="padding-right:44px;">
        <button type="button" onclick="togglePw('regPw', this)"
                style="position:absolute;right:14px;top:50%;transform:translateY(-50%);
                       background:none;border:none;cursor:pointer;font-size:16px;
                       color:var(--text-3);padding:0;line-height:1;">👁</button>
      </div>
    </div>
    <div class="form-group">
      <label>Confirm password</label>
      <div style="position:relative;">
        <input type="password" name="confirm" id="regPwConfirm"
               placeholder="Repeat password" required style="padding-right:44px;">
        <button type="button" onclick="togglePw('regPwConfirm', this)"
                style="position:absolute;right:14px;top:50%;transform:translateY(-50%);
                       background:none;border:none;cursor:pointer;font-size:16px;
                       color:var(--text-3);padding:0;line-height:1;">👁</button>
      </div>
    </div>
    <button type="submit" class="btn btn-full" style="margin-top:8px;">Create account →</button>
  </form>
  <div class="auth-footer">
    Already have an account? <a href="{{ url_for('login') }}" class="link">Sign in</a>
  </div>
  <div style="text-align:center;margin-top:16px;">
    <a href="{{ url_for('login') }}" class="btn btn-secondary" style="padding:10px 28px;">← Back to login</a>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function togglePw(id, btn) {
  const inp = document.getElementById(id);
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  btn.textContent = show ? '🙈' : '👁';
}
</script>
{% endblock %}
